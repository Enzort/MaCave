{% extends "base.html" %}
{% block contenu %}
<h2>Modifier mon évaluation</h2>
<p>{{ v.domaine }} - {{ v.nom }} {{ v.millesime }}</p>
<form method="post">
  <p><label for="note">Note (entier de 0 à 20) :</label>
     <input type="number" id="note" name="note" min="0" max="20" value="{{ ev.note }}" required></p>
  <p><label for="commentaire">Commentaire :</label><br>
     <textarea id="commentaire" name="commentaire" rows="4" cols="50">{{ ev.commentaire or '' }}</textarea></p>
  <p><button type="submit">Enregistrer</button>
     <a href="{{ url_for('vin', vin_id=v.id) }}">Annuler</a></p>
</form>
{% endblock %}
