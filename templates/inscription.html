{% extends "base.html" %}
{% block contenu %}
<h2>Inscription</h2>
<form method="post">
  <p><label for="identifiant">Identifiant :</label>
     <input type="text" id="identifiant" name="identifiant" required></p>
  <p><label for="email">Adresse électronique :</label>
     <input type="email" id="email" name="email" required></p>
  <p><label for="mot_de_passe">Mot de passe (6 caractères minimum) :</label>
     <input type="password" id="mot_de_passe" name="mot_de_passe" required></p>
  <p><label for="confirmation">Confirmer le mot de passe :</label>
     <input type="password" id="confirmation" name="confirmation" required></p>
  <p><button type="submit">Créer mon compte</button></p>
</form>
<p><a href="{{ url_for('connexion') }}">Déjà un compte ? Se connecter</a></p>
{% endblock %}
